<article
  class="empty-card"
  [class.empty-card--compact]="compact()"
  [class.empty-card--fill]="fill()"
>
  <div class="empty-card__icon" aria-hidden="true">
    @switch (icon()) {
      @case ('chat') {
        <svg viewBox="0 0 24 24">
          <path
            fill="currentColor"
            d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"
          />
        </svg>
      }
      @case ('results') {
        <svg viewBox="0 0 24 24">
          <path
            fill="currentColor"
            d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14H7v-2h5v2zm5-4H7v-2h10v2zm0-4H7V7h10v2z"
          />
        </svg>
      }
      @case ('history') {
        <svg viewBox="0 0 24 24">
          <path
            fill="currentColor"
            d="M12 3C7.03 3 3 6.58 3 11c0 1.61.52 3.1 1.41 4.34L3 21l5.84-1.2A10.9 10.9 0 0 0 12 19c4.97 0 9-3.58 9-8s-4.03-8-9-8z"
          />
        </svg>
      }
      @case ('users') {
        <svg viewBox="0 0 24 24">
          <path
            fill="currentColor"
            d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"
          />
        </svg>
      }
      @case ('search') {
        <svg viewBox="0 0 24 24">
          <path
            fill="currentColor"
            d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C8.01 14 6 11.99 6 9.5S8.01 5 10.5 5 15 7.01 15 9.5 12.99 14 10.5 14z"
          />
        </svg>
      }
      @case ('jobs') {
        <svg viewBox="0 0 24 24">
          <path
            fill="currentColor"
            d="M20 6h-4V4c0-1.11-.89-2-2-2h-4c-1.11 0-2 .89-2 2v2H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-6 0h-4V4h4v2z"
          />
        </svg>
      }
      @default {
        <svg viewBox="0 0 24 24">
          <path
            fill="currentColor"
            d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zm-2-10H7v2h10V9zm0 4H7v2h10v-2z"
          />
        </svg>
      }
    }
  </div>

  <h2 class="empty-card__title">{{ title() }}</h2>

  @if (description()) {
    <p class="empty-card__desc">{{ description() }}</p>
  }

  <div class="empty-card__actions">
    <ng-content select="[emptyActions]" />
  </div>
</article>
